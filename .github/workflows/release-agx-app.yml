name: Build & Release AGX App

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agx

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone agx-app
        uses: actions/checkout@v4
        with:
          repository: ramarlina/agx-app
          path: agx-app
          token: ${{ secrets.REPO_TOKEN }}

      - name: Clone agx-cloud
        uses: actions/checkout@v4
        with:
          repository: ramarlina/agx-cloud
          path: agx-cloud
          token: ${{ secrets.REPO_TOKEN }}

      - name: Install agx-cloud dependencies
        run: npm ci
        working-directory: agx-cloud

      - name: Install agx-app dependencies
        run: npm ci
        working-directory: agx-app

      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac
        working-directory: agx-app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: agx-mac-dmg
          path: agx-app/dist/*.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: agx-mac-zip
          path: agx-app/dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agx-app/dist/*.dmg
            agx-app/dist/*.zip
          draft: true
          generate_release_notes: true
