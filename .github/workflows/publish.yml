name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agx

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install agx dependencies
        run: npm ci
        working-directory: agx

      - name: Build local app workspace
        run: npm run local:build
        working-directory: agx

      - name: Bundle board runtime
        run: npm run board:bundle
        working-directory: agx

      - name: Smoke check bundled board
        run: test -n "$(find cloud-runtime/standalone -name server.js -print -quit)"
        working-directory: agx

      - name: Run tests
        run: npm test -- --testPathIgnorePatterns=board
        working-directory: agx

      - name: Publish
        run: npm publish --access public
        working-directory: agx
