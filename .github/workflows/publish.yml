name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agx

      - name: Clone agx-cloud
        uses: actions/checkout@v4
        with:
          repository: ramarlina/agx-cloud
          path: agx-cloud
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install agx-cloud dependencies
        run: npm ci
        working-directory: agx-cloud

      - name: Install agx dependencies
        run: npm ci
        working-directory: agx

      - name: Build cloud runtime
        run: npm run board:bundle
        working-directory: agx

      - name: Run tests
        run: npm test
        working-directory: agx

      - name: Publish
        run: npm publish --access public
        working-directory: agx
